
name: Deploy Nimony docs to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  repository_dispatch:
    types: [ nimony-updated ]
  schedule:
    # Run every 6 hours to check for updates
    - cron: '0 */6 * * *'


# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  pages: write      # to deploy to Pages
  id-token: write   # to verify the deployment originates from an appropriate source

jobs:
  # Build job
  build:
    # Pinned, not `ubuntu-latest`: the docs build compiles C now (see the gcc-14
    # step below), and nimony's own CI validates exactly this image.
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Make gcc-14 the default C compiler
        run: |
          # Generating the stdlib docs is a full nimony compile — `tall.nim`
          # reaches a macro plugin, which nimony builds through hexer and cc —
          # so the C compiler is part of this build, not just Nim. gcc-14 is
          # what nimony's own CI and this repo's nightly.yml test with; the
          # 24.04 image defaults to gcc-13, which nothing validates. Both are
          # preinstalled, so this only flips the alternative (a few seconds).
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 60 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14

      # nifler compiles Nim's own compiler/parser.nim (resolved via `--path:$nim`,
      # see nimony/src/nifler/nim.cfg), so the stdlib docs can only be parsed by a
      # Nim whose parser already knows the syntax nimony's lib/ uses (e.g.
      # `concept of A`, Nim devel d9e28aac8). Stable Nim is always too old for
      # that, which is why this build installs `devel` — same as nightly.yml.
      - uses: alaviss/setup-nim@0.1.1
        with:
          path: 'nim'
          version: devel

      - name: Overlay current Nim compiler source (devel parser fixes)
        run: |
          # setup-nim installs a prebuilt nightly which can lag `devel` by weeks,
          # so overlay fresh compiler sources on top of the nightly's bootstrap.
          git clone --depth 1 --branch devel https://github.com/nim-lang/Nim nim-src
          cp -a nim-src/compiler/. nim/compiler/
          cp -a nim-src/lib/packages/docutils/. nim/lib/packages/docutils/
 

      - name: Checkout nim-lang/nimony (docs)
        uses: actions/checkout@v6
        with:
          repository: nim-lang/nimony
          path: nimony
          ref: master
          submodules: recursive
          fetch-depth: 0  # Get full history to check for changes

      - name: Create dist/nimony symlink for Nim compiler
        run: |
          # Nim devel's compiler imports `../dist/nimony/src/lib/...` (ast2nif,
          # icnifcore, deps, ...), so the sources overlaid above only compile
          # when that path resolves. nifler compiles Nim's `compiler/parser.nim`
          # and today reaches none of those modules, but nothing guarantees that
          # — nimony's ci.yml and this repo's nightly.yml both stage the link,
          # and it must come after the nimony checkout it points at.
          rm -rf nim/dist/nimony
          mkdir -p nim/dist
          ln -sf "${{ github.workspace }}/nimony" nim/dist/nimony

      - name: Check for changes in nimony
        id: check-changes
        run: |
          # For scheduled runs, check if there are changes since last run
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Get the last commit hash from the previous run (you'd need to store this)
            # For now, we'll always build on schedule - you can enhance this later
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare site directory
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          nim c -r build.nim


      - name: Upload static files as artifact
        id: deployment
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v4 # or specific "vX.X.X" version tag for this action
        with:
          path: site/

  # Deployment job
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.has_changes == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
